<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Admin | Javy Suplementos</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#050709" />
    <link rel="icon" href="img/icons/logo-16x16.png" type="image/png" />
    <link rel="stylesheet" href="css/admin-dashboard.css?v=handoff-redesign-6" />
    <link rel="stylesheet" href="css/dropdown.css?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/whatsapp-config.js" defer></script>
    <script src="js/product-data.js" defer></script>
    <script src="js/db.js?v=no-img-fallback" defer></script>
    <script src="js/auth.js?v=session-state" defer></script>
    <script src="js/icons.js?v=icons" defer></script>
    <script src="js/dropdown.js?v=2" defer></script>
    <script type="module" src="js/admin/main.js?v=handoff-redesign"></script>
  </head>
  <body class="ad-body">
    <div class="ad-app" data-anim="on" id="adminApp">
      <!-- Gate de acceso -->
      <section class="ad-gate" id="adminGate" aria-live="polite">
        <div class="ad-gate__card">
          <img src="img/icons/logo.png" alt="Javy Supplements" />
          <p class="ad-gate__kicker">Panel privado</p>
          <h1>Validando acceso</h1>
          <p id="adminGateMessage">Revisando sesión y permisos de administrador…</p>
          <span class="ad-gate__loader" aria-hidden="true"></span>
        </div>
      </section>

      <!-- Shell (oculto hasta validar admin) -->
      <div class="ad-shell" id="adminShell" hidden>
        <aside class="ad-sidebar" aria-label="Navegación del panel">
          <a class="ad-brand" href="index.html" aria-label="Ir a la tienda">
            <img src="img/icons/logo.png" alt="" />
            <span><strong>Javy</strong><small>Admin</small></span>
          </a>
          <nav class="ad-nav" id="adminNav" aria-label="Secciones"></nav>
          <button class="ad-logout" id="adminLogoutBtn" type="button">
            <span class="ad-ico" data-javy-icon="log-out" aria-hidden="true"></span>
            Cerrar sesión
          </button>
        </aside>

        <main class="ad-main">
          <header class="ad-topbar">
            <div class="ad-topbar__title">
              <h1 id="adminTitle">Dashboard</h1>
              <p id="adminSubtitle">Resumen de la tienda y acciones pendientes</p>
            </div>
            <div class="ad-topbar__actions">
              <div class="ad-search">
                <span class="ad-ico" data-javy-icon="search" aria-hidden="true"></span>
                <input type="search" id="adminSearch" placeholder="Buscar producto" aria-label="Buscar producto" />
              </div>
              <button class="ad-btn ad-btn--primary" id="adminAddBtn" type="button">
                <span class="ad-ico" data-javy-icon="plus" aria-hidden="true"></span>
                Agregar producto
              </button>
            </div>
          </header>

          <div id="adminView"></div>
        </main>
      </div>

      <!-- Bottom nav (mobile) -->
      <nav class="ad-tabbar" id="adminTabbar" aria-label="Navegación rápida"></nav>

      <!-- Sheet "Más" (mobile) -->
      <div class="ad-sheet" id="adminSheet">
        <div class="ad-sheet__backdrop" data-close-sheet></div>
        <div class="ad-sheet__panel">
          <h3>Más secciones</h3>
          <div class="ad-sheet__grid" id="adminSheetGrid"></div>
        </div>
      </div>

      <!-- Hosts dinámicos -->
      <div id="adminDrawerHost"></div>
      <div id="adminConfirmHost"></div>
      <div class="ad-toast-host" id="adminToastHost" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
