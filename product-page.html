<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javy Suplementos</title>

    <!-- SEO -->
    <meta name="description" content="Mirá el precio, las características y agregá este suplemento a tu cotización. Enviala por WhatsApp en segundos con Javy Suplementos.">
    <link rel="canonical" href="https://javysuplementos.vercel.app/product-page.html">

    <!-- Open Graph (se actualizan dinámicamente por JS cuando carga el producto) -->
    <meta property="og:type" content="product">
    <meta property="og:url" content="https://javysuplementos.vercel.app/product-page.html">
    <meta property="og:title" content="Javy Suplementos">
    <meta property="og:description" content="Mirá el precio, las características y agregá este suplemento a tu cotización. Enviala por WhatsApp en segundos.">
    <meta property="og:image" content="https://javysuplementos.vercel.app/img/images/javi.webp">
    <meta property="og:locale" content="es_PA">
    <meta property="og:site_name" content="Javy Suplementos">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Javy Suplementos">
    <meta name="twitter:description" content="Mirá el precio, las características y agregá este suplemento a tu cotización. Enviala por WhatsApp en segundos.">
    <meta name="twitter:image" content="https://javysuplementos.vercel.app/img/images/javi.webp">

    <link rel="icon" href="img/icons/logo-16x16.png" type="image/png" />
    <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/components/nav.css?v=admin-auth" />
    <link rel="stylesheet" href="css/components/auth.css?v=session-state" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components/cart.css" />


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet">
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vast+Shadow&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/whatsapp-config.js" defer></script>
    <script src="js/product-data.js" defer></script>
    <script src="js/db.js?v=admin-auth" defer></script>
    <script src="js/auth.js?v=session-state" defer></script>
    <script src="js/icons.js?v=icons" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/product-page.js" defer></script>
    <script src="js/include-nav.js?v=admin-auth" defer></script>
  </head>
  <body>
    <div id="site-header"></div>
       <main class="main-container">
      <section class="product-detail">
        <div class="product-detail__inner">

          <div class="product-detail__media">
            <img
              id="prod-image"
              src=""
              alt=""
              class="product-detail__img"
            />
          </div>

        
          <div class="product-detail__info">
            <h1 id="prod-title" class="product-detail__title"></h1>
            <p id="prod-subtitle" class="product-detail__subtitle"></p>

            <div class="product-detail__meta">
              <span id="prod-price" class="product-detail__price"></span>
              <span id="prod-tag" class="product-detail__tag"></span>
            </div>

            <dl class="product-detail__data">
              <div>
                <dt>Marca</dt>
                <dd id="prod-brand"></dd>
              </div>
              <div>
                <dt>Categoría</dt>
                <dd id="prod-category"></dd>
              </div>
              <div>
                <dt>Sabores</dt>
                <dd id="prod-flavors"></dd>
              </div>
              <div>
                <dt>Estado</dt>
                <dd id="prod-status"></dd>
              </div>
            </dl>

            <div class="product-detail__actions">
              <button
                id="prod-whatsapp"
                type="button"
                class="product-detail__cta"
              >
                Cotizar este producto
              </button>

              <button
                id="prod-add-consultation"
                type="button"
                class="product-detail__cta product-detail__cta--secondary"
              >
                Agregar a cotización
              </button>

              <button
                id="prod-availability"
                type="button"
                class="product-detail__cta product-detail__cta--secondary"
                hidden
              >
                Consultar disponibilidad
              </button>
            </div>

            <div class="product-tabs">
              <div class="product-tabs__list" role="tablist" aria-label="Información del suplemento">
                <button
                  class="product-tabs__btn is-active"
                  type="button"
                  role="tab"
                  aria-selected="true"
                  aria-controls="tab-beneficios"
                  data-tab="beneficios"
                >
                  Beneficios
                </button>
                <button
                  class="product-tabs__btn"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="tab-descripcion"
                  data-tab="descripcion"
                >
                  Descripción
                </button>
                <button
                  class="product-tabs__btn"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="tab-uso"
                  data-tab="uso"
                >
                  Cómo usar
                </button>
              </div>


              <div
                id="tab-beneficios"
                class="product-tabs__panel is-active"
                role="tabpanel"
                aria-labelledby="tab-beneficios"
                data-tab-panel="beneficios"
              ></div>

              <div
                id="tab-descripcion"
                class="product-tabs__panel"
                role="tabpanel"
                aria-labelledby="tab-descripcion"
                data-tab-panel="descripcion"
                hidden
              ></div>

              <div
                id="tab-uso"
                class="product-tabs__panel"
                role="tabpanel"
                aria-labelledby="tab-uso"
                data-tab-panel="uso"
                hidden
              ></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    </body>
    </html>
