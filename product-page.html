<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javy Suplementos</title>

    <!-- SEO -->
    <meta name="description" content="Mirá el precio, las características y agregá este suplemento a tu cotización. Enviala por WhatsApp en segundos con Javy Suplementos.">
    <link rel="canonical" href="https://carlosbazan28.github.io/javysuplementos/product-page.html">

    <!-- Open Graph (se actualizan dinámicamente por JS cuando carga el producto) -->
    <meta property="og:type" content="product">
    <meta property="og:url" content="https://carlosbazan28.github.io/javysuplementos/product-page.html">
    <meta property="og:title" content="Javy Suplementos">
    <meta property="og:description" content="Mirá el precio, las características y agregá este suplemento a tu cotización. Enviala por WhatsApp en segundos.">
    <meta property="og:image" content="https://carlosbazan28.github.io/javysuplementos/img/images/javi.webp">
    <meta property="og:locale" content="es_PA">
    <meta property="og:site_name" content="Javy Suplementos">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Javy Suplementos">
    <meta name="twitter:description" content="Mirá el precio, las características y agregá este suplemento a tu cotización. Enviala por WhatsApp en segundos.">
    <meta name="twitter:image" content="https://carlosbazan28.github.io/javysuplementos/img/images/javi.webp">

    <link rel="icon" href="img/icons/logo-16x16.png" type="image/png" />
    <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/components/nav.css?v=admin-auth" />
    <link rel="stylesheet" href="css/components/auth.css?v=session-state" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components/cart.css" />
    <link rel="stylesheet" href="css/pages/product.css" />


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet">
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vast+Shadow&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/whatsapp-config.js" defer></script>
    <script src="js/product-data.js" defer></script>
    <script src="js/db.js?v=admin-auth" defer></script>
    <script src="js/auth.js?v=session-state" defer></script>
    <script src="js/icons.js?v=icons" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/product-page.js" defer></script>
    <script src="js/include-nav.js?v=admin-auth" defer></script>
  </head>
  <body>
    <div id="site-header"></div>
    <main class="pdp">
      <div class="pdp__container">

        <nav class="pdp__breadcrumb" aria-label="Ruta de navegación">
          <a href="supplements-page.html">Catálogo</a>
          <span class="pdp__breadcrumb-sep">/</span>
          <span id="pdp-breadcrumb-cat"></span>
        </nav>

        <div class="pdp__mobilehead">
          <span class="pdp__mobilehead-title">Detalle</span>
          <span class="pdp__status" data-status-pill></span>
        </div>

        <h1 class="pdp__heading">Detalle del producto</h1>

        <div class="pdp__layout">

          <figure class="pdp__media">
            <img id="prod-image" class="pdp__img" src="" alt="" />
            <figcaption class="pdp__media-caption">Imagen principal del producto</figcaption>
          </figure>

          <section class="pdp__info">
            <div class="pdp__info-head">
              <h2 id="prod-title" class="pdp__title"></h2>
              <span class="pdp__status" data-status-pill></span>
            </div>
            <p id="prod-subtitle" class="pdp__subtitle"></p>
            <p id="prod-price" class="pdp__price"></p>

            <dl class="pdp__data">
              <div>
                <dt>Marca</dt>
                <dd id="prod-brand"></dd>
              </div>
              <div>
                <dt>Categoría</dt>
                <dd id="prod-category"></dd>
              </div>
              <div>
                <dt>Estado</dt>
                <dd id="prod-status"></dd>
              </div>
            </dl>

            <div class="pdp__selectors">
              <div class="pdp__field">
                <label class="pdp__label" for="prod-flavor-select">Sabores</label>
                <div id="prod-flavors"></div>
              </div>
              <div class="pdp__field pdp__field--qty">
                <span class="pdp__label">Cantidad</span>
                <div class="pdp__stepper" role="group" aria-label="Cantidad">
                  <button type="button" class="pdp__qty-btn" data-qty-dec aria-label="Disminuir">−</button>
                  <span class="pdp__qty-value" data-qty-value aria-live="polite">1</span>
                  <button type="button" class="pdp__qty-btn pdp__qty-btn--plus" data-qty-inc aria-label="Aumentar">+</button>
                </div>
              </div>
            </div>

            <p class="pdp__hint">Selecciona sabor y cantidad antes de agregarlo a la cotización.</p>

            <button id="prod-add-consultation" type="button" class="pdp__cta" data-add-cta>
              Agregar a cotización
            </button>
            <button id="prod-availability" type="button" class="pdp__cta pdp__cta--ghost" data-availability-cta hidden>
              Consultar disponibilidad
            </button>
          </section>

          <section class="pdp__details">
            <h3 class="pdp__details-title">Información<span class="pdp__hide-mobile"> del producto</span></h3>
            <div class="pdp__tabs">
              <div class="pdp__tabs-bar" role="tablist" aria-label="Información del suplemento">
                <button class="pdp__tab is-active" type="button" role="tab" aria-selected="true" data-tab="beneficios">Beneficios</button>
                <button class="pdp__tab" type="button" role="tab" aria-selected="false" data-tab="descripcion">Descripción</button>
                <button class="pdp__tab" type="button" role="tab" aria-selected="false" data-tab="uso">Cómo usar</button>
              </div>

              <div class="pdp__panels">
                <article class="pdp__panel is-active" data-panel="beneficios">
                  <button class="pdp__acc-head" type="button" data-acc aria-expanded="true">
                    <span>Beneficios</span>
                    <span class="pdp__acc-icon" aria-hidden="true"></span>
                  </button>
                  <div class="pdp__panel-body">
                    <h4 class="pdp__panel-title">Beneficios principales</h4>
                    <div id="tab-beneficios" class="pdp__benefits"></div>
                  </div>
                </article>

                <article class="pdp__panel" data-panel="descripcion">
                  <button class="pdp__acc-head" type="button" data-acc aria-expanded="false">
                    <span>Descripción</span>
                    <span class="pdp__acc-icon" aria-hidden="true"></span>
                  </button>
                  <div class="pdp__panel-body">
                    <div id="tab-descripcion" class="pdp__prose"></div>
                  </div>
                </article>

                <article class="pdp__panel" data-panel="uso">
                  <button class="pdp__acc-head" type="button" data-acc aria-expanded="false">
                    <span>Cómo usar</span>
                    <span class="pdp__acc-icon" aria-hidden="true"></span>
                  </button>
                  <div class="pdp__panel-body">
                    <div id="tab-uso" class="pdp__prose"></div>
                  </div>
                </article>
              </div>
            </div>
          </section>
        </div>

        <div class="pdp__bar">
          <div class="pdp__bar-info">
            <span class="pdp__bar-strong pdp__bar-price" id="pdp-bar-price"></span>
            <span class="pdp__bar-strong pdp__bar-ready">Listo para cotizar</span>
            <span class="pdp__bar-sub">
              <span data-bar-units>1 unidad</span>
              <span class="pdp__bar-flavornote" data-bar-flavor> · sabor por elegir</span>
            </span>
          </div>
          <button type="button" class="pdp__cta pdp__bar-cta" data-add-cta>Agregar a cotización</button>
        </div>

      </div>
    </main>
  </body>
</html>
